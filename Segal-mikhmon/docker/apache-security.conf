ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
<FilesMatch "^(config|readcfg|lang|setlang|settheme)\.php$">
    Require all denied
</FilesMatch>
<DirectoryMatch "^/var/www/html/(lib|docker|\.git|\.github)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "\.(md|yml|yaml|txt|sh|ini|log|rar|zip)$">
    Require all denied
</FilesMatch>
